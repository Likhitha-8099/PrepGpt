# Server Configuration
server.port=${SERVER_PORT:8080}

# Spring Application Name
spring.application.name=PrepGPT Backend

# Database Configuration (Using environment variables with fallbacks)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:prepgpt}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234567890}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Springdoc OpenAPI / Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Groq Unified AI + Voice Configuration (AI, STT, TTS)
groq.api-key=${GROQ_API_KEY:}
groq.ai.model=${GROQ_AI_MODEL:openai/gpt-oss-120b}
groq.ai.base-url=${GROQ_AI_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
groq.stt.model=${GROQ_STT_MODEL:whisper-large-v3-turbo}
groq.stt.base-url=${GROQ_STT_BASE_URL:https://api.groq.com/openai/v1/audio/transcriptions}
groq.tts.model=${GROQ_TTS_MODEL:canopylabs/orpheus-v1-english}
groq.tts.base-url=${GROQ_TTS_BASE_URL:https://api.groq.com/openai/v1/audio/speech}
voice.provider=${VOICE_PROVIDER:groq}

# Multipart Audio File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Resume Upload Directory Configuration
app.upload.dir=${RESUME_UPLOAD_DIR:uploads/resumes}

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Error Response Hardening (Prevent internal exception or stacktrace disclosure)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Rate Limiting Configuration
ratelimit.enabled=${RATE_LIMIT_ENABLED:true}

# CORS Allowed Origins Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Resilience4j Circuit Breaker Configuration for Groq AI
resilience4j.circuitbreaker.instances.groq.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.groq.sliding-window-size=${RESILIENCE_CB_SLIDING_WINDOW_SIZE:10}
resilience4j.circuitbreaker.instances.groq.minimum-number-of-calls=${RESILIENCE_CB_MIN_CALLS:5}
resilience4j.circuitbreaker.instances.groq.failure-rate-threshold=${RESILIENCE_CB_FAILURE_RATE_THRESHOLD:50}
resilience4j.circuitbreaker.instances.groq.wait-duration-in-open-state=${RESILIENCE_CB_WAIT_DURATION_OPEN:30s}
resilience4j.circuitbreaker.instances.groq.permitted-number-of-calls-in-half-open-state=${RESILIENCE_CB_HALF_OPEN_CALLS:2}
resilience4j.circuitbreaker.instances.groq.automatic-transition-from-open-to-half-open-enabled=true

# Resilience4j Retry Configuration for Groq AI (Transient failures only)
resilience4j.retry.instances.groq.max-attempts=${RESILIENCE_RETRY_MAX_ATTEMPTS:3}
resilience4j.retry.instances.groq.wait-duration=${RESILIENCE_RETRY_WAIT_DURATION:1000ms}
resilience4j.retry.instances.groq.enable-exponential-backoff=true
resilience4j.retry.instances.groq.exponential-backoff-multiplier=2.0

# PrepGPT DB-Backed Evaluation Retry Reaper Configuration
prepgpt.evaluation.retry.max-attempts=${PREPGPT_EVAL_RETRY_MAX_ATTEMPTS:3}
prepgpt.evaluation.retry.initial-delay-seconds=${PREPGPT_EVAL_RETRY_INITIAL_DELAY_SECONDS:60}
prepgpt.evaluation.retry.backoff-multiplier=${PREPGPT_EVAL_RETRY_BACKOFF_MULTIPLIER:2.0}
prepgpt.evaluation.retry.cron=${PREPGPT_EVAL_RETRY_CRON:0 */1 * * * *}

# Spring Boot Actuator Observability Configuration (Operational Safety: expose only health, info, metrics)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

# Structured Logging Pattern with MDC Correlation ID
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [correlationId=%X{correlationId:-SYSTEM}] %-5level %logger{36} - %msg%n


